// ============================================================
//  Сборка Android TV версии Tsuzuki.
//  Команда: gradlew assembleRelease  →  app/build/outputs/apk/release/
// ============================================================
plugins {
    id 'com.android.application'
}

// ИЗМЕНЕНО В 1.6.1: настройки подписи читаются из keystore.properties (см. ниже)
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) {
    keystoreFile.withInputStream { keystoreProps.load(it) }
}
// Без keystore.properties релизную сборку не делаем — иначе получится APK,
// который не встанет поверх установленного. Отладочная сборка работает и без него.
gradle.taskGraph.whenReady { graph ->
    if (!keystoreFile.exists() && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException('Нет файла keystore.properties рядом с проектом. ' +
            'Создай ключ: tsuzuki-src/tools/make-keystore.bat (подробно — в README).')
    }
}

android {
    namespace 'local.tsuzuki.tv'
    compileSdk 35

    defaultConfig {
        // applicationId ОСТАЁМ старым намеренно: иначе новая версия не встанет
        // поверх установленного AniDesk-TV, и данные пропадут. Название в лаунчере
        // берётся из android:label (Tsuzuki), а не отсюда.
        applicationId 'local.anidesk.tv'
        minSdk 23          // Android 6.0 — подходит почти всем ТВ и приставкам
        targetSdk 35
        versionCode 11  // ИЗМЕНЕНО В 1.6.2
        versionName '1.6.3'
    }

    // ИЗМЕНЕНО В 1.6.1: ключ подписи и пароли больше НЕ лежат в коде.
    // Они в файле keystore.properties рядом с этим проектом (в git не попадает).
    // Создать новый ключ и этот файл: tsuzuki-src\tools\make-keystore.bat
    // Формат keystore.properties:
    //   storeFile=C:/Users/имя/Documents/Tsuzuki-key/tsuzuki-release.jks
    //   storePassword=…
    //   keyAlias=tsuzuki
    //   keyPassword=…
    // ВАЖНО: ТВ и телефон подписываются ОДНИМ ключом; потеряешь ключ —
    // обновления APK перестанут ставиться поверх. Храни 2 копии (флешка + облако).
    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
    // ДОБАВЛЕНО В 1.5: фоновая проверка серий и FileProvider для обновлений
    implementation 'androidx.work:work-runtime:2.9.1'
    implementation 'androidx.core:core:1.13.1'
}
