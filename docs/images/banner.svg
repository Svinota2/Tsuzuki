    <rect x="-46" y="-46" width="92" height="92" rx="22" fill="#111318" stroke="#262b35" stroke-width="2"/>
    <path d="M0 -30 L30 0 L0 30 L-30 0 Z M0 -12 L-12 0 L0 12 L12 0 Z" fill="#ff5d48" fill-rule="evenodd"/>
  </g>

  <text x="200" y="172" font-family="'Segoe UI','Inter','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="84" fill="#e9ecf2" letter-spacing="-1">Tsuzuki</text>
